version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: "-"
    rebase-strategy:  "disabled" # set "disabled" if running on GH-hosted runners
